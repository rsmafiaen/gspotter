name: CI/CD - Linter, formatter and tests

on:
  push:
    branches:
      - main
  pull_request:
    types:
      - opened
      - synchronize

jobs:
  lint-format-and-test:
    runs-on: [self-hosted]
    timeout-minutes: 10

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Write env file
        run: >
          printf 'DATABASE_URL="postgresql://ci:ci@localhost:5432/ci"\n' >
          packages/db/.env

      - name: Generate Prisma client
        run: pnpm --filter @t09-project-2/db run db:generate

      - name: Check formatting
        run: pnpm check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test
